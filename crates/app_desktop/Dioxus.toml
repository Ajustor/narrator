# Identité de l'application pour `dx build`/`dx bundle`.
#
# Sans ce fichier, `dx` génère une identité de remplacement
# (`com.example.AppDesktop`) régénérée à chaque build : l'APK installée ne
# peut alors pas être mise à jour en place de façon fiable, et le nom
# affiché sur l'appareil est celui du crate (« AppDesktop ») et non celui
# du jeu.
#
# Champs validés contre le schéma de `dx` 0.7 (`dx config schema`) :
# `application.name` (nom affiché), `bundle.identifier` (applicationId
# Android / namespace Gradle) et `bundle.icon` (icône de l'app).
#
# NOTE CONFIRMÉE EMPIRIQUEMENT : `application.name` est ignoré par `dx`
# 0.7.9 pour les builds Android — le libellé affiché sur l'appareil vient
# en réalité du nom de l'exécutable Cargo produit, pas de ce champ. Voir
# le `[[bin]]` dans Cargo.toml (renommé en "Narrator" pour cette raison).
# Ce champ reste présent car il s'applique correctement aux autres
# plateformes (desktop) et pourrait être pris en compte par une future
# version de `dx` pour Android.

[application]
name = "Narrator"

[bundle]
identifier = "com.alexandregambier.narrateur"
icon = ["assets/icon.png"]
