# Identité de l'application pour `dx build`/`dx bundle`.
#
# Sans ce fichier, `dx` génère une identité de remplacement
# (`com.example.AppDesktop`) régénérée à chaque build : l'APK installée ne
# peut alors pas être mise à jour en place de façon fiable, et le nom
# affiché sur l'appareil est celui du crate (« AppDesktop ») et non celui
# du jeu.
#
# Champs validés contre le schéma de `dx` 0.7 (`dx config schema`) :
# `application.name` (nom affiché), `bundle.identifier` (applicationId
# Android / namespace Gradle) et `bundle.icon` (icône de l'app).
#
# NOTE CONFIRMÉE EMPIRIQUEMENT : `application.name` est ignoré par `dx`
# 0.7.9 pour les builds Android — le libellé affiché sur l'appareil vient
# en réalité du nom de l'exécutable Cargo produit, pas de ce champ. Voir
# le `[[bin]]` dans Cargo.toml (renommé en "Narrator" pour cette raison).
# Ce champ reste présent car il s'applique correctement aux autres
# plateformes (desktop) et pourrait être pris en compte par une future
# version de `dx` pour Android.
#
# NOTE CONFIRMÉE EMPIRIQUEMENT (même limitation) : ni `bundle.icon` ni
# `android.icon` ci-dessous ne sont appliqués par `dx` 0.7.9 pour Android —
# testé avec `dx build` ET `dx bundle`, les deux régénèrent
# systématiquement le gabarit d'icône par défaut d'Android Studio, à
# chaque invocation. Les deux champs restent déclarés (inoffensifs, et
# corrects pour desktop) au cas où une future version de `dx` les
# applique enfin pour Android ; en attendant, c'est
# `scripts/patch_icone_android.sh` qui pose la vraie icône après coup —
# voir ce script et les instructions d'installation Android pour la
# séquence complète (le patch doit être réappliqué après tout
# `dx build`/`dx bundle`, puis le paquet reconstruit via `./gradlew
# assembleDebug` directement, sans repasser par `dx`).

[application]
name = "Narrator"

[bundle]
identifier = "com.alexandregambier.narrateur"
icon = ["assets/icon.png"]

[android]
icon = ["assets/icon.png"]

# Mise à jour Android (`mise_a_jour::lancer_installation`). Ces deux
# déclarations sont CONFIRMÉES EMPIRIQUEMENT comme appliquées par `dx`
# 0.7.9 (permission présente dans le AndroidManifest.xml généré, fichier
# .pro copié dans le module Gradle `app/`, que `build.gradle.kts` inclut via
# `fileTree(".") { include("**/*.pro") }`). Le `<provider>` FileProvider et
# `res/xml/file_paths.xml`, eux, ne peuvent PAS être déclarés ici :
# `[android.raw] application` est silencieusement ignoré par le gabarit de
# manifeste de `dx` 0.7.9, et aucun champ n'ajoute de ressource `res/` —
# c'est `scripts/patch_manifest_maj_android.sh` qui les pose après chaque
# `dx build`/`dx bundle` (même contrat que `scripts/patch_icone_android.sh`).
proguard_rules = ["android/proguard-maj.pro"]

[android.permissions]
"android.permission.REQUEST_INSTALL_PACKAGES" = { description = "Installer les mises à jour de l'application" }
