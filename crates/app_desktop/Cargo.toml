[package]
name = "app_desktop"
version = "0.1.0"
edition = "2021"

# Nom du binaire produit — c'est de là que `dx` dérive le libellé affiché
# sur l'écran d'accueil Android (confirmé empiriquement : `dx` 0.7.9
# ignore `[application] name` dans Dioxus.toml pour Android et utilise ce
# nom à la place). Renommé en "Narrator" pour cette raison ; n'affecte ni
# le nom du crate/package ci-dessus, ni l'identifiant Android
# (`bundle.identifier` dans Dioxus.toml), seulement le nom de
# l'exécutable produit (desktop et Android).
[[bin]]
name = "Narrator"
path = "src/main.rs"

[features]
default = ["plateforme-desktop"]
plateforme-desktop = ["dioxus/desktop"]
plateforme-android = ["dioxus/mobile", "dep:ndk-context", "dep:jni"]
# `dioxus/document` est déjà activé inconditionnellement ci-dessous (la
# fonctionnalité `document::eval`/`document::Style` est utilisée sur
# toutes les plateformes). Cette feature ne fait qu'exposer un nom au
# niveau du crate `app_desktop` lui-même, pour que les commandes de build
# Android (`cargo ndk ... --features plateforme-android,document`,
# `dx build ... --features plateforme-android,document`) restent valides
# telles qu'elles sont documentées, sans rien changer au comportement.
document = ["dioxus/document"]

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
infra = { path = "../infra" }
dioxus = { version = "0.7", default-features = false, features = ["document", "macro", "hooks", "signals", "html", "launch", "logger"] }
futures-channel = "0.3"
futures-util = "0.3"
# Minuterie pour fermer le dialogue de dé plus vite que la fin du tour
# (voir `main.rs`, fermeture de `de_en_attente`) — `dioxus-desktop` fait
# déjà tourner un runtime tokio complet (confirmé dans `Cargo.lock`), donc
# cette dépendance n'ajoute aucun runtime supplémentaire, seulement l'accès
# direct à `tokio::time::sleep` depuis ce crate.
tokio = { version = "1", default-features = false, features = ["time"] }
# `features = ["tls"]` et non `["rustls"]` : dans ureq 2.x, `rustls` n'est
# que le nom de la dépendance optionnelle — l'activer seul ne branche
# aucun connecteur TLS, et tout appel HTTPS échoue immédiatement avec
# `ErrorKind::UnknownScheme` ("no TLS backend is configured"). C'est la
# feature `tls` qui active réellement le connecteur (rustls +
# webpki-roots embarqués), ce dont le téléchargement du modèle depuis
# huggingface.co dépend entièrement.
ureq = { version = "2", default-features = false, features = ["tls"] }
ndk-context = { version = "0.1", optional = true }
jni = { version = "0.21", optional = true }
