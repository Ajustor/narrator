[package]
name = "app_desktop"
version = "0.1.0"
edition = "2021"

[features]
default = ["plateforme-desktop"]
plateforme-desktop = ["dioxus/desktop"]
plateforme-android = ["dioxus/mobile", "dep:ndk-context", "dep:jni"]
# `dioxus/document` est déjà activé inconditionnellement ci-dessous (la
# fonctionnalité `document::eval`/`document::Style` est utilisée sur
# toutes les plateformes). Cette feature ne fait qu'exposer un nom au
# niveau du crate `app_desktop` lui-même, pour que les commandes de build
# Android (`cargo ndk ... --features plateforme-android,document`,
# `dx build ... --features plateforme-android,document`) restent valides
# telles qu'elles sont documentées, sans rien changer au comportement.
document = ["dioxus/document"]

[dependencies]
domain = { path = "../domain" }
application = { path = "../application" }
infra = { path = "../infra" }
dioxus = { version = "0.7", default-features = false, features = ["document", "macro", "hooks", "signals", "html", "launch"] }
futures-channel = "0.3"
futures-util = "0.3"
ureq = { version = "2", default-features = false, features = ["rustls"] }
ndk-context = { version = "0.1", optional = true }
jni = { version = "0.21", optional = true }
